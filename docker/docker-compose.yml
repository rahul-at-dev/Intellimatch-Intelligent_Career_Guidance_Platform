version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intellimatch
      POSTGRES_PASSWORD: intellimatch
      POSTGRES_DB: intellimatch
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellimatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/intellimatch
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4jdata:/data"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]

  api:
    build:
      context: ./apps/api
    env_file: ./apps/api/.env.example
    environment:
      DATABASE_URL: postgresql://intellimatch:intellimatch@postgres:5432/intellimatch
      REDIS_URL: redis://redis:6379/0
      NEO4J_URL: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./apps/api
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis, api]
    command: celery -A app.worker:celery_app worker --loglevel=info

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
    command: npm run start

volumes:
  pgdata:
  neo4jdata:
  qdrantdata:
